<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bKash Payment - Checkout</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .checkout-container {
            max-width: 500px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
    </style>
</head>
<body>

    <div class="checkout-container">
        <div class="text-center">

            <img src="Bkash-Logo.jpg" height="200" width="300">
            
            <h3>Complete Your Payment</h3>
            <p class="lead">Please enter your details to proceed with the payment.</p>
        </div>

        <form action="payment-success.html" method="post">
            <!-- Amount Field (display total from cart) 
            <div class="mb-3">
                <label for="total" class="form-label">Amount</label>
                <input type="text" class="form-control" id="total" value="$<span id="checkout-total">0</span>" disabled>
            </div>
        
            -->

            <!-- Phone Number (for bKash) -->
            <div class="mb-3">
                <label for="phone" class="form-label">bKash Number</label>
                <input type="text" class="form-control" id="phone" placeholder="Enter your bKash number" required>
            </div>

            <!-- Transaction PIN -->
            <div class="mb-3">
                <label for="pin" class="form-label">bKash PIN</label>
                <input type="password" class="form-control" id="pin" placeholder="Enter your bKash PIN" required>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-custom w-100">Pay Now</button>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
